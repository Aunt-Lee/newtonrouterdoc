site_name: Newton AI Router
site_description: Newton AI Router documentation
site_url: https://newtonrouterdoc.vercel.app

repo_name: GitHub

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/images/newton.png
  favicon: assets/images/newton.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - announce.dismiss
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - navigation.footer
    - navigation.path
    - navigation.expand
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh
          name: 简体中文
          build: true
          site_name: 牛顿AI中转站
          site_description: 牛顿AI中转站使用文档
          nav_translations:
            Quick Start: 快速开始
            CLI Tool Setup: CLI 工具配置
            CC Switch Setup (Recommended): CC Switch 安装配置（推荐）
            Codex Setup: Codex 工具配置
            Claude Code Setup: Claude Code 工具配置
            FAQ: 常见问题
            Claude Code FAQ: Claude Code 常见问题
  - search:
      lang:
        - zh
        - en
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/
      name: GitHub

nav:
  - Quick Start: index.md
  - CLI Tool Setup:
      - CC Switch Setup (Recommended): CliConfig/CCSwitchConfig.md
      - Codex Setup: CliConfig/CodexConfig.md
      - Claude Code Setup: CliConfig/ClaudeCodeConfig.md
  - FAQ:
      - Claude Code FAQ: QA/ClaudeCodeQA.md
  - Blog:
      - OpenRouter Alternatives 2026: blog/openrouter-alternatives-2026.md
